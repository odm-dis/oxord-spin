<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Win</title>
    <!-- Tailwind CSS for modern layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for winning celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e6f2f2 0%, #b3d9d9 100%);
            min-height: 100vh;
        }
        /* Custom wheel shadow and pointer styling */
        .wheel-container {
            position: relative;
            width: 360px;
            height: 360px;
            max-width: 100%;
            margin: 0 auto;
        }
        @media (min-width: 640px) {
            .wheel-container {
                width: 440px;
                height: 440px;
            }
        }
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #005f5f;
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6">

    <header class="w-full max-w-2xl text-center my-4">
        <div class="inline-block bg-teal-800 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow-sm">
            Lucky Draw
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-teal-900 tracking-tight">Spin & Win</h1>
        <p class="text-teal-700 mt-1 text-sm sm:text-base">Spin the wheel and test your fortune!</p>
    </header>

    <main class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-teal-100 p-6 sm:p-8 flex flex-col items-center my-auto">
        
        <!-- Wheel Area -->
        <div class="wheel-container my-2">
            <!-- Triangle Pointer -->
            <div class="pointer"></div>
            <!-- Canvas Wheel -->
            <canvas id="wheelCanvas" width="440" height="440" class="w-full h-full rounded-full shadow-lg border-4 border-teal-700 cursor-pointer"></canvas>
            <!-- Center Hub -->
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 bg-gradient-to-br from-teal-600 to-teal-800 rounded-full border-4 border-white shadow-md flex items-center justify-center text-white font-bold text-xs uppercase tracking-tighter select-none pointer-events-none">
                SPIN
            </div>
        </div>

        <!-- Spin Button -->
        <div class="mt-6 w-full flex flex-col items-center">
            <button id="spinBtn" class="w-full sm:w-auto px-10 py-4 bg-gradient-to-r from-teal-600 to-teal-800 hover:from-teal-700 hover:to-teal-900 text-white font-bold text-lg rounded-2xl shadow-lg hover:shadow-xl transform transition active:scale-95 focus:outline-none focus:ring-4 focus:ring-teal-300">
                🎯 Spin Now!
            </button>
            <p id="statusText" class="text-xs sm:text-sm text-teal-600 font-medium mt-3 h-5">Ready to spin the wheel!</p>
        </div>

        <!-- History Section -->
        <div class="w-full mt-6 border-t border-teal-100 pt-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-teal-800 uppercase tracking-wider">Recent Wins</h3>
                <button id="clearHistory" class="text-xs text-teal-600 hover:text-teal-900 underline font-medium">Clear History</button>
            </div>
            <div id="historyList" class="flex flex-col gap-2 max-h-28 overflow-y-auto pr-1">
                <div class="text-xs text-teal-500 italic bg-teal-50/50 p-2 rounded-xl text-center">No wins recorded yet. Spin to win!</div>
            </div>
        </div>
    </main>

    <div id="winModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 text-center transform scale-95 transition-transform duration-300 border border-teal-100">
            <div class="w-16 h-16 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                🎁
            </div>
            <h2 class="text-2xl font-extrabold text-teal-900">Congratulations!</h2>
            <p class="text-sm text-teal-600 mt-1">You successfully won:</p>
            <div id="modalPrize" class="my-4 py-3 px-4 bg-teal-50 text-teal-900 font-bold text-xl rounded-2xl border border-teal-200">
                Prize Name
            </div>
            <div class="flex gap-3 mt-6">
                <button id="claimBtn" class="flex-1 bg-teal-700 hover:bg-teal-800 text-white font-semibold py-3 px-4 rounded-xl shadow transition">
                    Claim Prize
                </button>
                <button id="closeModalBtn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-xl transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <footer class="w-full max-w-2xl text-center text-xs text-teal-700 mt-4">
        &copy; 2026 Spin & Win Experience. All rights reserved.
    </footer>

    <script>
        // Base 5 items repeated 5 times to form exactly 25 segments
        const baseItems = [
            { text: "White Umbrella", color: "#ffffff", textColor: "#005f5f" },
            { text: "Mousepad", color: "#008080", textColor: "#ffffff" },
            { text: "Coin Pouch", color: "#e6f2f2", textColor: "#005f5f" },
            { text: "Mugs", color: "#005f5f", textColor: "#ffffff" },
            { text: "Folding fan", color: "#b3d9d9", textColor: "#003b3b" },
            { text: "Keychain", color: "#008080", textColor: "#ffffff" }
        ];

        // Construct 25 segments array by repeating baseItems 5 times
        const prizes = [];
        for (let i = 0; i < 5; i++) {
            baseItems.forEach(item => {
                prizes.push({ ...item });
            });
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const statusText = document.getElementById('statusText');
        const winModal = document.getElementById('winModal');
        const modalPrize = document.getElementById('modalPrize');
        const claimBtn = document.getElementById('claimBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistory');

        let currentAngle = 0;
        let isSpinning = false;
        let recentWins = [];

        // Load history from localStorage if available
        try {
            const saved = localStorage.getItem('spin_history_25');
            if (saved) {
                recentWins = JSON.parse(saved);
                renderHistory();
            }
        } catch (e) {
            console.error('Could not load history', e);
        }

        // Draw the wheel segments on canvas
        function drawWheel(angleOffset = 0) {
            const numSegments = prizes.length; // 25
            const arcSize = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const startAngle = angleOffset + i * arcSize;
                const endAngle = startAngle + arcSize;

                // Draw Slice Background
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius - 4, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                ctx.strokeStyle = '#005f5f';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = prizes[i].textColor;
                ctx.font = 'bold 11px Inter, sans-serif';
                
                // Truncate or fit text neatly for 25 segments
                let displayText = prizes[i].text;
                ctx.fillText(displayText, radius - 20, 4);
                ctx.restore();
            }
        }

        // Initial draw
        drawWheel(currentAngle);

        // Spin logic with easing animation
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusText.textContent = "Spinning the 25-slot wheel...";

            const numSegments = prizes.length;
            const arcSize = (2 * Math.PI) / numSegments;

            // Random extra spins (between 5 and 8 full rotations) plus random segment offset
            const extraRotations = (Math.floor(Math.random() * 4) + 5) * 2 * Math.PI;
            const randomSegmentIndex = Math.floor(Math.random() * numSegments);
            
            // Calculate exact target angle so pointer at top (-Math.PI / 2 radians) lands on chosen segment
            const targetSegmentCenterAngle = randomSegmentIndex * arcSize + arcSize / 2;
            const targetAngle = currentAngle + extraRotations + ((1.5 * Math.PI - targetSegmentCenterAngle - currentAngle) % (2 * Math.PI));

            const startTime = performance.now();
            const duration = 10000; // 10 seconds spin time

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Custom ease-out cubic function for smooth deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                const currentAnimatedAngle = currentAngle + (targetAngle - currentAngle) * easeOut;
                drawWheel(currentAnimatedAngle);

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    currentAngle = targetAngle % (2 * Math.PI);
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    
                    const winningPrize = prizes[randomSegmentIndex];
                    handleWin(winningPrize);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        // Handle winning outcome
        function handleWin(prize) {
            statusText.textContent = `🎉 You won: ${prize.text}!`;
            modalPrize.textContent = prize.text;
            
            // Trigger Confetti Celebration
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            // Add to history
            const winEntry = {
                prize: prize.text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            recentWins.unshift(winEntry);
            if (recentWins.length > 10) recentWins.pop(); // Keep last 10
            
            try {
                localStorage.setItem('spin_history_25', JSON.stringify(recentWins));
            } catch (e) {
                console.error('Could not save history', e);
            }

            renderHistory();
            openModal();
        }

        // Render history list
        function renderHistory() {
            if (recentWins.length === 0) {
                historyList.innerHTML = `<div class="text-xs text-teal-500 italic bg-teal-50/50 p-2 rounded-xl text-center">No wins recorded yet. Spin to win!</div>`;
                return;
            }

            historyList.innerHTML = recentWins.map(item => `
                <div class="flex justify-between items-center bg-teal-50/80 px-3 py-2 rounded-xl text-xs border border-teal-100">
                    <span class="font-bold text-teal-900">🎁 ${item.prize}</span>
                    <span class="text-teal-600">${item.time}</span>
                </div>
            `).join('');
        }

        // Modal Controls
        function openModal() {
            winModal.classList.remove('hidden');
            setTimeout(() => {
                winModal.classList.remove('opacity-0');
                winModal.firstElementChild.classList.remove('scale-95');
                winModal.firstElementChild.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            winModal.classList.add('opacity-0');
            winModal.firstElementChild.classList.remove('scale-100');
            winModal.firstElementChild.classList.add('scale-95');
            setTimeout(() => {
                winModal.classList.add('hidden');
            }, 300);
        }

        // Event Listeners
        spinBtn.addEventListener('click', spinWheel);
        canvas.addEventListener('click', spinWheel);
        closeModalBtn.addEventListener('click', closeModal);
        claimBtn.addEventListener('click', () => {
            closeModal();
            statusText.textContent = "Prize claimed successfully! Spin again anytime.";
        });

        clearHistoryBtn.addEventListener('click', () => {
            recentWins = [];
            localStorage.removeItem('spin_history_25');
            renderHistory();
        });

        // Close modal on background click
        winModal.addEventListener('click', (e) => {
            if (e.target === winModal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
